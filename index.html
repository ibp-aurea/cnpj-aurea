document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"3c042342-460a-42b8-be56-556ec4cc6c27\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/**\n * Aurea Design Tokens\n * Versão: 1.1 — 2026-07-06\n * Mudança (jul/2026): superfície da marca = verde-dólar VD-7 #50644D (antes #133A24);\n * ação segue navy; mirrors JSON reconciliados a este arquivo (source of truth).\n *\n * Como usar:\n * Importe este arquivo no entry point do CSS do produto.\n * Todos os valores visuais devem referenciar estes tokens.\n * Nunca use valores literais de cor, fonte ou espaçamento diretamente no CSS de componentes.\n *\n * Padrão: LIGHT MODE. O produto opera em light mode por padrão.\n * Modo escuro: adicione a classe `.dk` ou `data-theme=\"dark\"` ao elemento raiz\n * (<html> ou <body>) para ativar os tokens dark. Opt-in explícito (o fallback\n * automático via @media prefers-color-scheme foi removido).\n */\n\n/* =============================================================================\n   PRIMITIVOS — valores brutos, não use diretamente em componentes\n   ============================================================================= */\n\n:root {\n  /* Brand — Gold (warm metallic, amber→bronze) */\n  --primitive-gold-400: #E2C46B;\n  --primitive-gold-500: #CBA03A;\n  --primitive-gold-600: #B07E2B;\n  --primitive-gold-700: #8A5F20;\n\n  /* Brand — Ink (verde-escuro quase preto) */\n  --primitive-ink-900: #0B1A0F;\n  --primitive-ink-800: #1A2820;\n  --primitive-ink-700: #243020;\n\n  /* Brand — Cream (creme quente) */\n  --primitive-cream-50:  #FDFCF8;\n  --primitive-cream-100: #F9F8F3;\n  --primitive-cream-200: #F4F0E8;\n  --primitive-cream-300: #EAE5D8;\n\n  /* Brand — Verde-dólar (superfície oficial de TODOS os materiais; lê claramente verde) */\n  /* VD-7 #50644D é A cor da marca. 900/700 são apenas ELEVAÇÃO do mesmo verde:\n     900 = mais profundo (full-bleed / dark-mode subtle); 700 = mais claro (contêineres aninhados). */\n  --primitive-dark-900: #3E4E3A;   /* verde-dólar profundo */\n  --primitive-dark-800: #50644D;   /* VD-7 — verde-dólar · superfície canônica */\n  --primitive-dark-700: #5E735A;   /* verde-dólar elevado — contêineres pequenos / raised */\n\n  /* Neutros */\n  --primitive-neutral-50:  #F9F8F5;\n  --primitive-neutral-100: #F4F0E8;\n  --primitive-neutral-200: #EAE5D8;\n  --primitive-neutral-300: #D5CFC0;\n  --primitive-neutral-400: #B8B2A5;\n  --primitive-neutral-500: #8F8A80;\n  --primitive-neutral-600: #6B6660;\n  --primitive-neutral-700: #4A4540;\n  --primitive-neutral-800: #2F393B;\n  --primitive-neutral-900: #1A2020;\n  --primitive-neutral-950: #0B1A0F;\n\n  /* Acento — Navy (cor interativa: CTAs, links, foco) */\n  --primitive-navy-900: #0F1E35;\n  --primitive-navy-800: #1B2D4F;\n  --primitive-navy-700: #264570;\n  --primitive-navy-600: #34568A;\n  --primitive-navy-500: #486EA8;\n\n  /* Semânticos — Success */\n  --primitive-success-900: #14532D;\n  --primitive-success-700: #1B8A4B;\n  --primitive-success-500: #22A35A;\n  --primitive-success-400: #46B377;\n  --primitive-success-bg-light: #E4F2E9;\n  --primitive-success-bg-dark: rgba(70, 179, 119, 0.14);\n\n  /* Semânticos — Warning */\n  --primitive-warning-900: #78350F;\n  --primitive-warning-700: #C68214;\n  --primitive-warning-500: #D9971F;\n  --primitive-warning-400: #E0A33A;\n  --primitive-warning-bg-light: #FAEDD2;\n  --primitive-warning-bg-dark: rgba(224, 163, 58, 0.14);\n\n  /* Semânticos — Error */\n  --primitive-error-900: #7F1D1D;\n  --primitive-error-700: #C0392B;\n  --primitive-error-500: #D04A3A;\n  --primitive-error-400: #E06A5A;\n  --primitive-error-bg-light: #F8E3DF;\n  --primitive-error-bg-dark: rgba(224, 106, 90, 0.14);\n\n  /* Semânticos — Info */\n  --primitive-info-700: #2E6F7E;\n  --primitive-info-500: #387E8E;\n  --primitive-info-400: #5BA3B4;\n  --primitive-info-bg-light: #DFEBED;\n  --primitive-info-bg-dark: rgba(91, 163, 180, 0.14);\n\n  /* Data Viz — 8 cores neutras de gráfico */\n  /* Paleta sóbria — tom financeiro, aprovada em revisão 2026-05-28 */\n  --primitive-dataviz-1: #4E7DAA;   /* azul ardósia */\n  --primitive-dataviz-2: #7B68A2;   /* violeta suave */\n  --primitive-dataviz-3: #3E8B62;   /* verde floresta */\n  --primitive-dataviz-4: #B8923A;   /* âmbar quente */\n  --primitive-dataviz-5: #A85268;   /* rosé escuro */\n  --primitive-dataviz-6: #3E8E8E;   /* teal ardósia */\n  --primitive-dataviz-7: #A86834;   /* terracota */\n  --primitive-dataviz-8: #5968A8;   /* periwinkle */\n\n  /* Data Viz — variantes claras (dark mode) */\n  --primitive-dataviz-1-dk: #7AA3C8;\n  --primitive-dataviz-2-dk: #9A88C0;\n  --primitive-dataviz-3-dk: #5EAA82;\n  --primitive-dataviz-4-dk: #D4AE54;\n  --primitive-dataviz-5-dk: #C47088;\n  --primitive-dataviz-6-dk: #5EACAC;\n  --primitive-dataviz-7-dk: #C48854;\n  --primitive-dataviz-8-dk: #7888C8;\n}\n\n\n/* =============================================================================\n   TOKENS SEMÂNTICOS — light mode (padrão)\n   Use estes em componentes.\n   ============================================================================= */\n\n:root,\n[data-theme=\"light\"],\n.lt {\n\n  /* --- Superfícies --- */\n  --color-bg-default:     var(--primitive-cream-200);   /* #F4F0E8 — fundo principal */\n  --color-bg-subtle:      var(--primitive-cream-100);   /* #F9F8F3 — fundo secundário */\n  --color-bg-muted:       var(--primitive-cream-300);   /* #EAE5D8 — fundo de seção */\n  --color-surface:        #FFFFFF;                       /* branco — cards, painéis */\n  --color-surface-raised: #FFFFFF;\n  --color-border:         var(--primitive-neutral-300); /* #D5CFC0 — borda padrão */\n  --color-border-subtle:  var(--primitive-neutral-200); /* #EAE5D8 — borda sutil */\n\n  /* --- Superfícies escuras sobre claro (verde-dólar VD-7) ---\n     Campos escuros GRANDES (full-bleed, capas, seções, sidebar) usam\n     --color-inverse-surface = VD-7 #50644D. Contêineres escuros PEQUENOS\n     aninhados SOBRE um painel verde (chips, icon tiles) sobem para\n     --color-inverse-container (#5E735A) para não se fundirem no painel. */\n  --color-inverse-surface:   var(--primitive-dark-800);  /* #50644D — VD-7, campos escuros grandes */\n  --color-inverse-container: var(--primitive-dark-700);  /* #5E735A — contêineres escuros aninhados */\n\n  /* --- Texto --- */\n  --color-text-primary:   var(--primitive-ink-900);                    /* #0B1A0F */\n  --color-text-secondary: rgba(11, 26, 15, 0.58);\n  --color-text-tertiary:  rgba(11, 26, 15, 0.32);\n  --color-text-disabled:  rgba(11, 26, 15, 0.24);\n  --color-text-on-brand:  var(--primitive-cream-200);                  /* texto sobre gold */\n  --color-text-on-dark:   var(--primitive-cream-200);\n\n  /* --- Marca --- */\n  --color-brand:          var(--primitive-gold-600);    /* #B07E2B — ouro quente em light */\n  --color-brand-subtle:   rgba(176, 126, 43, 0.12);\n  --color-brand-on-dark:  var(--primitive-gold-400);    /* #E2C46B — ouro sobre tile/superfície verde-dólar (contraste ≥3:1; NÃO use --color-brand no escuro) */\n  --color-accent-navy:    var(--primitive-navy-800);    /* #1B2D4F */\n  --color-action:         var(--primitive-navy-800);   /* #1B2D4F — navy (decisão 2026-05) */\n  --color-action-hover:   var(--primitive-navy-900);   /* #0F1E35 */\n  --color-action-subtle:  rgba(27, 45, 79, 0.08);\n\n  /* --- Semânticas --- */\n  --color-success:        var(--primitive-success-700);\n  --color-success-bg:     var(--primitive-success-bg-light);\n  --color-warning:        var(--primitive-warning-700);\n  --color-warning-bg:     var(--primitive-warning-bg-light);\n  --color-error:          var(--primitive-error-700);\n  --color-error-bg:       var(--primitive-error-bg-light);\n  --color-info:           var(--primitive-info-700);\n  --color-info-bg:        var(--primitive-info-bg-light);\n\n  /* --- Data Viz --- */\n  --dataviz-1: var(--primitive-dataviz-1);\n  --dataviz-2: var(--primitive-dataviz-2);\n  --dataviz-3: var(--primitive-dataviz-3);\n  --dataviz-4: var(--primitive-dataviz-4);\n  --dataviz-5: var(--primitive-dataviz-5);\n  --dataviz-6: var(--primitive-dataviz-6);\n  --dataviz-7: var(--primitive-dataviz-7);\n  --dataviz-8: var(--primitive-dataviz-8);\n\n  /* --- Elevação (sombras) --- */\n  --shadow-none:    none;\n  --shadow-low:     0 1px 3px rgba(11, 26, 15, 0.08), 0 1px 2px rgba(11, 26, 15, 0.05);\n  --shadow-mid:     0 4px 6px rgba(11, 26, 15, 0.07), 0 2px 4px rgba(11, 26, 15, 0.05);\n  --shadow-high:    0 10px 15px rgba(11, 26, 15, 0.10), 0 4px 6px rgba(11, 26, 15, 0.04);\n  --shadow-overlay: 0 20px 25px rgba(11, 26, 15, 0.10), 0 10px 10px rgba(11, 26, 15, 0.03);\n}\n\n\n/* =============================================================================\n   TOKENS SEMÂNTICOS — dark mode\n   ============================================================================= */\n\n[data-theme=\"dark\"],\n.dk {\n  /* --- Superfícies --- */\n  --color-bg-default:     var(--primitive-dark-900);     /* #3E4E3A — deep green page (dark: mais contraste) */\n  --color-bg-subtle:      var(--primitive-dark-900);     /* #3E4E3A — deep */\n  --color-bg-muted:       var(--primitive-dark-800);     /* #50644D — VD-7 raised (destaca sobre o deep) */\n  --color-surface:        rgba(255, 255, 255, 0.05);\n  --color-surface-raised: rgba(255, 255, 255, 0.08);\n  --color-border:         rgba(244, 240, 232, 0.12);\n  --color-border-subtle:  rgba(244, 240, 232, 0.07);\n\n  /* --- Texto --- */\n  --color-text-primary:   var(--primitive-cream-200);                   /* #F4F0E8 */\n  --color-text-secondary: rgba(244, 240, 232, 0.58);\n  --color-text-tertiary:  rgba(244, 240, 232, 0.32);\n  --color-text-disabled:  rgba(244, 240, 232, 0.24);\n  --color-text-on-brand:  var(--primitive-dark-900);\n  --color-text-on-dark:   var(--primitive-cream-200);\n\n  /* --- Marca --- */\n  --color-brand:          var(--primitive-gold-500);     /* #CBA03A — ouro quente em dark */\n  --color-brand-subtle:   rgba(203, 160, 58, 0.15);\n  --color-brand-on-dark:  var(--primitive-gold-400);     /* #E2C46B — ouro sobre superfície escura */\n  --color-accent-navy:    var(--primitive-navy-700);\n  --color-action:         var(--primitive-navy-600);   /* #34568A — navy em dark */\n  --color-action-hover:   var(--primitive-navy-500);   /* #486EA8 */\n  --color-action-subtle:  rgba(52, 86, 138, 0.16);\n\n  /* --- Semânticas --- */\n  --color-success:        var(--primitive-success-400);\n  --color-success-bg:     var(--primitive-success-bg-dark);\n  --color-warning:        var(--primitive-warning-400);\n  --color-warning-bg:     var(--primitive-warning-bg-dark);\n  --color-error:          var(--primitive-error-400);\n  --color-error-bg:       var(--primitive-error-bg-dark);\n  --color-info:           var(--primitive-info-400);\n  --color-info-bg:        var(--primitive-info-bg-dark);\n\n  /* --- Data Viz --- */\n  --dataviz-1: var(--primitive-dataviz-1-dk);\n  --dataviz-2: var(--primitive-dataviz-2-dk);\n  --dataviz-3: var(--primitive-dataviz-3-dk);\n  --dataviz-4: var(--primitive-dataviz-4-dk);\n  --dataviz-5: var(--primitive-dataviz-5-dk);\n  --dataviz-6: var(--primitive-dataviz-6-dk);\n  --dataviz-7: var(--primitive-dataviz-7-dk);\n  --dataviz-8: var(--primitive-dataviz-8-dk);\n\n  /* --- Elevação (sombras) --- */\n  --shadow-none:    none;\n  --shadow-low:     0 1px 3px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.2);\n  --shadow-mid:     0 4px 6px rgba(0, 0, 0, 0.3), 0 2px 4px rgba(0, 0, 0, 0.2);\n  --shadow-high:    0 10px 15px rgba(0, 0, 0, 0.4), 0 4px 6px rgba(0, 0, 0, 0.2);\n  --shadow-overlay: 0 20px 25px rgba(0, 0, 0, 0.5), 0 10px 10px rgba(0, 0, 0, 0.2);\n}\n\n/* Modo escuro é OPT-IN explícito: adicione `data-theme=\"dark\"` ou `.dk` ao\n   elemento raiz. Os tokens dark vivem no bloco [data-theme=\"dark\"], .dk acima\n   (é a API registrada). O produto é fixado em light. (Um fallback automático\n   via @media prefers-color-scheme foi removido para evitar duplicação de\n   valores — reative aplicando a classe no root conforme a preferência.) */\n\n\n/* =============================================================================\n   TIPOGRAFIA — tokens globais (independentes de tema)\n   ============================================================================= */\n\n:root {\n  /* Família */\n  --font-sans:    'Aptos', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;\n  --font-numeric: 'Aptos', 'Segoe UI', system-ui, -apple-system, sans-serif; /* ativar com font-variant-numeric: tabular-nums */\n\n  /* Escala — Editorial (marca, comunicação, decks) */\n  --font-size-display:    68px;\n  --font-size-h1:         52px;\n  --font-size-h2:         36px;\n  --font-size-h3:         28px;\n  --font-size-h4:         24px;\n  --font-size-body-lg:    24px;\n  --font-size-body:       20px;\n  --font-size-label:      14px;\n  --font-size-caption:    11px;\n\n  /* Escala — Produto (UI, tabelas, listas densas) */\n  --font-size-ui-2xl:     20px;\n  --font-size-ui-xl:      18px;\n  --font-size-ui-lg:      16px;\n  --font-size-ui-md:      14px;\n  --font-size-ui-sm:      13px;\n  --font-size-ui-xs:      12px;\n  --font-size-ui-2xs:     11px;\n\n  /* Pesos */\n  --font-weight-regular: 400;\n  --font-weight-medium:  500;\n  --font-weight-semibold: 600;\n  --font-weight-bold:    700;\n\n  /* Line heights */\n  --line-height-tighter: 1.0;\n  --line-height-tight:   1.2;\n  --line-height-snug:    1.35;\n  --line-height-normal:  1.5;\n  --line-height-relaxed: 1.7;\n  --line-height-loose:   1.8;\n\n  /* Letter spacing */\n  --letter-spacing-tight:   -0.01em;\n  --letter-spacing-normal:   0;\n  --letter-spacing-wide:     0.03em;\n  --letter-spacing-wider:    0.06em;\n  --letter-spacing-widest:   0.12em;\n\n  /* Regra: headings editoriais usam text-transform: uppercase + letter-spacing-wide ou wider */\n  /* Labels e captions: uppercase + widest */\n  /* Body e UI: sentence case + normal */\n}\n\n\n/* =============================================================================\n   ESPAÇAMENTO — escala 8px base\n   ============================================================================= */\n\n:root {\n  --space-0:   0;\n  --space-px:  1px;\n  --space-0-5: 2px;\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:   12px;\n  --space-4:   16px;\n  --space-5:   20px;\n  --space-6:   24px;\n  --space-7:   28px;\n  --space-8:   32px;\n  --space-10:  40px;\n  --space-12:  48px;\n  --space-14:  56px;\n  --space-16:  64px;\n  --space-20:  80px;\n  --space-24:  96px;\n  --space-28:  112px;\n  --space-32:  128px;\n  --space-40:  160px;\n\n  /* Aliases semânticos */\n  --space-section-y:    var(--space-20);   /* padding vertical de seções editoriais */\n  --space-container-x: var(--space-16);   /* margem lateral do container (mobile) */\n  --space-card:         var(--space-6);   /* padding interno de cards */\n  --space-input:        var(--space-3) var(--space-4);  /* padding de inputs */\n}\n\n\n/* =============================================================================\n   BORDAS E RAIOS\n   ============================================================================= */\n\n:root {\n  --radius-none: 0;\n  --radius-sm:   4px;   /* inputs, tags, small elements */\n  --radius-md:   8px;   /* cards, botões, dropdowns */\n  --radius-lg:   12px;  /* modais, drawers, popovers */\n  --radius-xl:   16px;  /* hero cards, banners */\n  --radius-2xl:  24px;  /* large surfaces */\n  --radius-full: 9999px; /* pills, badges, avatars */\n\n  --border-width-thin:    1px;\n  --border-width-default: 1.5px;\n  --border-width-thick:   2px;\n}\n\n\n/* =============================================================================\n   MOTION — duração e easing\n   ============================================================================= */\n\n:root {\n  /* Durações */\n  --duration-instant:  80ms; /* @kind other */\n  --duration-fast:     150ms; /* @kind other */\n  --duration-normal:   250ms; /* @kind other */\n  --duration-slow:     400ms; /* @kind other */\n  --duration-spiral:   700ms; /* @kind other */\n  --duration-page:     300ms; /* @kind other */\n\n  /* Easing */\n  --ease-default:  cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-in:       cubic-bezier(0.4, 0, 1, 1); /* @kind other */\n  --ease-out:      cubic-bezier(0, 0, 0.2, 1); /* @kind other */\n  --ease-spring:   cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n  --ease-linear:   linear; /* @kind other */\n\n  /* Propriedades de transição prontas */\n  --transition-colors:    color var(--duration-fast) var(--ease-default),\n                          background-color var(--duration-fast) var(--ease-default),\n                          border-color var(--duration-fast) var(--ease-default);\n  --transition-opacity:   opacity var(--duration-normal) var(--ease-default); /* @kind other */\n  --transition-transform: transform var(--duration-normal) var(--ease-out); /* @kind other */\n  --transition-shadow:    box-shadow var(--duration-fast) var(--ease-default); /* @kind other */\n  --transition-all:       all var(--duration-normal) var(--ease-default); /* @kind other */\n}\n\n\n/* =============================================================================\n   BREAKPOINTS — referência (use via @media, não via variável CSS)\n   ============================================================================= */\n\n/*\n  xs:   0–479px      (mobile pequeno)\n  sm:   480–767px    (mobile)\n  md:   768–1023px   (tablet)\n  lg:   1024–1279px  (desktop pequeno)\n  xl:   1280–1535px  (desktop)\n  2xl:  1536px+      (desktop grande)\n\n  Grid do produto web:\n  - Colunas: 12\n  - Gutter:  24px\n  - Margem lateral: 24px (mobile) / 32px (tablet) / 64px (desktop+)\n  - Max width container: 1440px\n*/\n\n\n/* =============================================================================\n   Z-INDEX — camadas\n   ============================================================================= */\n\n:root {\n  --z-behind:    -1; /* @kind other */\n  --z-base:       0; /* @kind other */\n  --z-raised:    10; /* @kind other */\n  --z-dropdown:  100; /* @kind other */\n  --z-sticky:    200; /* @kind other */\n  --z-overlay:   300; /* @kind other */\n  --z-modal:     400; /* @kind other */\n  --z-toast:     500; /* @kind other */\n  --z-tooltip:   600; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   AUREA — Typography · @font-face + semantic type roles\n   Built ON TOP of tokens.css (the source of truth for raw values).\n   Registers the Aptos brand face and ready-to-use role classes.\n   ============================================================ */\n\n/* Aptos is THE Aurea typeface (Microsoft 365 system face). Where Office/Aptos\n   is installed the real font renders via local(); everywhere else a bundled\n   metric-compatible proxy stands in under the same name, so layout, decks and\n   PPTX export stay identical and are tagged \"Aptos\". */\n@font-face {\n  font-family: \"Aptos\";\n  src: local(\"Aptos\"), local(\"Aptos Display\"), local(\"Aptos-Regular\"),\n       url(\"5842f606-37ce-43dd-9736-3c5b442d22c3\") format(\"truetype-variations\");\n  font-weight: 100 900;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* ============================================================\n   EDITORIAL ROLES — marca, comunicação, decks.\n   RULE: headings are UPPERCASE + tracked. Body is sentence case.\n   ============================================================ */\n.h-display{font-family:var(--font-sans);font-weight:var(--font-weight-bold);font-size:var(--font-size-display);line-height:var(--line-height-tighter);text-transform:uppercase;letter-spacing:var(--letter-spacing-wide);color:var(--color-text-primary)}\n.h1{font-family:var(--font-sans);font-weight:var(--font-weight-bold);font-size:var(--font-size-h1);line-height:var(--line-height-tight);text-transform:uppercase;letter-spacing:var(--letter-spacing-wide);color:var(--color-text-primary)}\n.h2{font-family:var(--font-sans);font-weight:var(--font-weight-bold);font-size:var(--font-size-h2);line-height:var(--line-height-tight);text-transform:uppercase;letter-spacing:var(--letter-spacing-wide);color:var(--color-text-primary)}\n.h3{font-family:var(--font-sans);font-weight:var(--font-weight-semibold);font-size:var(--font-size-h3);line-height:var(--line-height-snug);text-transform:uppercase;letter-spacing:var(--letter-spacing-wide);color:var(--color-text-primary)}\n.h4{font-family:var(--font-sans);font-weight:var(--font-weight-semibold);font-size:var(--font-size-h4);line-height:var(--line-height-snug);color:var(--color-text-primary)}\n.body-lg{font-family:var(--font-sans);font-weight:var(--font-weight-regular);font-size:var(--font-size-body-lg);line-height:var(--line-height-relaxed);color:var(--color-text-secondary)}\n.body{font-family:var(--font-sans);font-weight:var(--font-weight-regular);font-size:var(--font-size-body);line-height:var(--line-height-normal);color:var(--color-text-primary)}\n\n/* ============================================================\n   PRODUCT / UI ROLES — app surfaces, tables, dense lists.\n   Default UI size is 14px. Sentence case, no tracking.\n   ============================================================ */\n.ui-page-title{font-family:var(--font-sans);font-weight:var(--font-weight-semibold);font-size:var(--font-size-ui-xl);line-height:var(--line-height-snug);color:var(--color-text-primary)}\n.ui-lg{font-family:var(--font-sans);font-size:var(--font-size-ui-lg);line-height:var(--line-height-normal);color:var(--color-text-primary)}\n.ui{font-family:var(--font-sans);font-weight:var(--font-weight-regular);font-size:var(--font-size-ui-md);line-height:var(--line-height-normal);color:var(--color-text-primary)}\n.ui-sm{font-family:var(--font-sans);font-size:var(--font-size-ui-sm);line-height:var(--line-height-normal);color:var(--color-text-secondary)}\n.ui-xs{font-family:var(--font-sans);font-size:var(--font-size-ui-xs);line-height:var(--line-height-normal);color:var(--color-text-secondary)}\n\n/* ============================================================\n   LABELS, CAPTIONS, NUMERICS\n   ============================================================ */\n.eyebrow,.label{font-family:var(--font-sans);font-weight:var(--font-weight-semibold);font-size:var(--font-size-label);text-transform:uppercase;letter-spacing:var(--letter-spacing-widest);color:var(--color-brand)}\n.caption{font-family:var(--font-sans);font-weight:var(--font-weight-medium);font-size:var(--font-size-caption);text-transform:uppercase;letter-spacing:var(--letter-spacing-widest);color:var(--color-text-tertiary)}\n/* Numbers, currency, %, durations — ALWAYS tabular */\n.numeric{font-family:var(--font-numeric);font-weight:var(--font-weight-semibold);font-variant-numeric:tabular-nums;letter-spacing:var(--letter-spacing-tight);color:var(--color-text-primary)}\n.numeric--pos{color:var(--color-success)}\n.numeric--neg{color:var(--color-error)}\n\n/* ============================================================\n   SURFACE PATTERN — dark containers on light (verde-dólar VD-7)\n   Large dark fields (full-bleed, sections, sidebar) use .surface-inverse\n   = VD-7 #50644D. Small dark containers nested ON a green panel — chips,\n   icon tiles, badges — use .surface-inverse-container (#5E735A).\n   ============================================================ */\n.surface-inverse{background-color:var(--color-inverse-surface);color:var(--color-text-on-dark)}\n.surface-inverse-container{background-color:var(--color-inverse-container);color:var(--color-text-on-dark)}\n\n/* Convenience base — opt-in page reset */\n.aurea-base{background:var(--color-bg-default);color:var(--color-text-primary);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}\n<\u002Fstyle>\n<style>/* ============================================================\n   AUREA — Design System · global CSS entry point\n   Consumers link THIS one file. It is an @import manifest only —\n   never add rules here. tokens/tokens.css is the source of truth.\n   ============================================================ */\n/**\n * Aurea Design Tokens\n * Versão: 1.1 — 2026-07-06\n * Mudança (jul/2026): superfície da marca = verde-dólar VD-7 #50644D (antes #133A24);\n * ação segue navy; mirrors JSON reconciliados a este arquivo (source of truth).\n *\n * Como usar:\n * Importe este arquivo no entry point do CSS do produto.\n * Todos os valores visuais devem referenciar estes tokens.\n * Nunca use valores literais de cor, fonte ou espaçamento diretamente no CSS de componentes.\n *\n * Padrão: LIGHT MODE. O produto opera em light mode por padrão.\n * Modo escuro: adicione a classe `.dk` ou `data-theme=\"dark\"` ao elemento raiz\n * (<html> ou <body>) para ativar os tokens dark. Opt-in explícito (o fallback\n * automático via @media prefers-color-scheme foi removido).\n */\n\n/* =============================================================================\n   PRIMITIVOS — valores brutos, não use diretamente em componentes\n   ============================================================================= */\n\n:root {\n  /* Brand — Gold (warm metallic, amber→bronze) */\n  --primitive-gold-400: #E2C46B;\n  --primitive-gold-500: #CBA03A;\n  --primitive-gold-600: #B07E2B;\n  --primitive-gold-700: #8A5F20;\n\n  /* Brand — Ink (verde-escuro quase preto) */\n  --primitive-ink-900: #0B1A0F;\n  --primitive-ink-800: #1A2820;\n  --primitive-ink-700: #243020;\n\n  /* Brand — Cream (creme quente) */\n  --primitive-cream-50:  #FDFCF8;\n  --primitive-cream-100: #F9F8F3;\n  --primitive-cream-200: #F4F0E8;\n  --primitive-cream-300: #EAE5D8;\n\n  /* Brand — Verde-dólar (superfície oficial de TODOS os materiais; lê claramente verde) */\n  /* VD-7 #50644D é A cor da marca. 900/700 são apenas ELEVAÇÃO do mesmo verde:\n     900 = mais profundo (full-bleed / dark-mode subtle); 700 = mais claro (contêineres aninhados). */\n  --primitive-dark-900: #3E4E3A;   /* verde-dólar profundo */\n  --primitive-dark-800: #50644D;   /* VD-7 — verde-dólar · superfície canônica */\n  --primitive-dark-700: #5E735A;   /* verde-dólar elevado — contêineres pequenos / raised */\n\n  /* Neutros */\n  --primitive-neutral-50:  #F9F8F5;\n  --primitive-neutral-100: #F4F0E8;\n  --primitive-neutral-200: #EAE5D8;\n  --primitive-neutral-300: #D5CFC0;\n  --primitive-neutral-400: #B8B2A5;\n  --primitive-neutral-500: #8F8A80;\n  --primitive-neutral-600: #6B6660;\n  --primitive-neutral-700: #4A4540;\n  --primitive-neutral-800: #2F393B;\n  --primitive-neutral-900: #1A2020;\n  --primitive-neutral-950: #0B1A0F;\n\n  /* Acento — Navy (cor interativa: CTAs, links, foco) */\n  --primitive-navy-900: #0F1E35;\n  --primitive-navy-800: #1B2D4F;\n  --primitive-navy-700: #264570;\n  --primitive-navy-600: #34568A;\n  --primitive-navy-500: #486EA8;\n\n  /* Semânticos — Success */\n  --primitive-success-900: #14532D;\n  --primitive-success-700: #1B8A4B;\n  --primitive-success-500: #22A35A;\n  --primitive-success-400: #46B377;\n  --primitive-success-bg-light: #E4F2E9;\n  --primitive-success-bg-dark: rgba(70, 179, 119, 0.14);\n\n  /* Semânticos — Warning */\n  --primitive-warning-900: #78350F;\n  --primitive-warning-700: #C68214;\n  --primitive-warning-500: #D9971F;\n  --primitive-warning-400: #E0A33A;\n  --primitive-warning-bg-light: #FAEDD2;\n  --primitive-warning-bg-dark: rgba(224, 163, 58, 0.14);\n\n  /* Semânticos — Error */\n  --primitive-error-900: #7F1D1D;\n  --primitive-error-700: #C0392B;\n  --primitive-error-500: #D04A3A;\n  --primitive-error-400: #E06A5A;\n  --primitive-error-bg-light: #F8E3DF;\n  --primitive-error-bg-dark: rgba(224, 106, 90, 0.14);\n\n  /* Semânticos — Info */\n  --primitive-info-700: #2E6F7E;\n  --primitive-info-500: #387E8E;\n  --primitive-info-400: #5BA3B4;\n  --primitive-info-bg-light: #DFEBED;\n  --primitive-info-bg-dark: rgba(91, 163, 180, 0.14);\n\n  /* Data Viz — 8 cores neutras de gráfico */\n  /* Paleta sóbria — tom financeiro, aprovada em revisão 2026-05-28 */\n  --primitive-dataviz-1: #4E7DAA;   /* azul ardósia */\n  --primitive-dataviz-2: #7B68A2;   /* violeta suave */\n  --primitive-dataviz-3: #3E8B62;   /* verde floresta */\n  --primitive-dataviz-4: #B8923A;   /* âmbar quente */\n  --primitive-dataviz-5: #A85268;   /* rosé escuro */\n  --primitive-dataviz-6: #3E8E8E;   /* teal ardósia */\n  --primitive-dataviz-7: #A86834;   /* terracota */\n  --primitive-dataviz-8: #5968A8;   /* periwinkle */\n\n  /* Data Viz — variantes claras (dark mode) */\n  --primitive-dataviz-1-dk: #7AA3C8;\n  --primitive-dataviz-2-dk: #9A88C0;\n  --primitive-dataviz-3-dk: #5EAA82;\n  --primitive-dataviz-4-dk: #D4AE54;\n  --primitive-dataviz-5-dk: #C47088;\n  --primitive-dataviz-6-dk: #5EACAC;\n  --primitive-dataviz-7-dk: #C48854;\n  --primitive-dataviz-8-dk: #7888C8;\n}\n\n\n/* =============================================================================\n   TOKENS SEMÂNTICOS — light mode (padrão)\n   Use estes em componentes.\n   ============================================================================= */\n\n:root,\n[data-theme=\"light\"],\n.lt {\n\n  /* --- Superfícies --- */\n  --color-bg-default:     var(--primitive-cream-200);   /* #F4F0E8 — fundo principal */\n  --color-bg-subtle:      var(--primitive-cream-100);   /* #F9F8F3 — fundo secundário */\n  --color-bg-muted:       var(--primitive-cream-300);   /* #EAE5D8 — fundo de seção */\n  --color-surface:        #FFFFFF;                       /* branco — cards, painéis */\n  --color-surface-raised: #FFFFFF;\n  --color-border:         var(--primitive-neutral-300); /* #D5CFC0 — borda padrão */\n  --color-border-subtle:  var(--primitive-neutral-200); /* #EAE5D8 — borda sutil */\n\n  /* --- Superfícies escuras sobre claro (verde-dólar VD-7) ---\n     Campos escuros GRANDES (full-bleed, capas, seções, sidebar) usam\n     --color-inverse-surface = VD-7 #50644D. Contêineres escuros PEQUENOS\n     aninhados SOBRE um painel verde (chips, icon tiles) sobem para\n     --color-inverse-container (#5E735A) para não se fundirem no painel. */\n  --color-inverse-surface:   var(--primitive-dark-800);  /* #50644D — VD-7, campos escuros grandes */\n  --color-inverse-container: var(--primitive-dark-700);  /* #5E735A — contêineres escuros aninhados */\n\n  /* --- Texto --- */\n  --color-text-primary:   var(--primitive-ink-900);                    /* #0B1A0F */\n  --color-text-secondary: rgba(11, 26, 15, 0.58);\n  --color-text-tertiary:  rgba(11, 26, 15, 0.32);\n  --color-text-disabled:  rgba(11, 26, 15, 0.24);\n  --color-text-on-brand:  var(--primitive-cream-200);                  /* texto sobre gold */\n  --color-text-on-dark:   var(--primitive-cream-200);\n\n  /* --- Marca --- */\n  --color-brand:          var(--primitive-gold-600);    /* #B07E2B — ouro quente em light */\n  --color-brand-subtle:   rgba(176, 126, 43, 0.12);\n  --color-brand-on-dark:  var(--primitive-gold-400);    /* #E2C46B — ouro sobre tile/superfície verde-dólar (contraste ≥3:1; NÃO use --color-brand no escuro) */\n  --color-accent-navy:    var(--primitive-navy-800);    /* #1B2D4F */\n  --color-action:         var(--primitive-navy-800);   /* #1B2D4F — navy (decisão 2026-05) */\n  --color-action-hover:   var(--primitive-navy-900);   /* #0F1E35 */\n  --color-action-subtle:  rgba(27, 45, 79, 0.08);\n\n  /* --- Semânticas --- */\n  --color-success:        var(--primitive-success-700);\n  --color-success-bg:     var(--primitive-success-bg-light);\n  --color-warning:        var(--primitive-warning-700);\n  --color-warning-bg:     var(--primitive-warning-bg-light);\n  --color-error:          var(--primitive-error-700);\n  --color-error-bg:       var(--primitive-error-bg-light);\n  --color-info:           var(--primitive-info-700);\n  --color-info-bg:        var(--primitive-info-bg-light);\n\n  /* --- Data Viz --- */\n  --dataviz-1: var(--primitive-dataviz-1);\n  --dataviz-2: var(--primitive-dataviz-2);\n  --dataviz-3: var(--primitive-dataviz-3);\n  --dataviz-4: var(--primitive-dataviz-4);\n  --dataviz-5: var(--primitive-dataviz-5);\n  --dataviz-6: var(--primitive-dataviz-6);\n  --dataviz-7: var(--primitive-dataviz-7);\n  --dataviz-8: var(--primitive-dataviz-8);\n\n  /* --- Elevação (sombras) --- */\n  --shadow-none:    none;\n  --shadow-low:     0 1px 3px rgba(11, 26, 15, 0.08), 0 1px 2px rgba(11, 26, 15, 0.05);\n  --shadow-mid:     0 4px 6px rgba(11, 26, 15, 0.07), 0 2px 4px rgba(11, 26, 15, 0.05);\n  --shadow-high:    0 10px 15px rgba(11, 26, 15, 0.10), 0 4px 6px rgba(11, 26, 15, 0.04);\n  --shadow-overlay: 0 20px 25px rgba(11, 26, 15, 0.10), 0 10px 10px rgba(11, 26, 15, 0.03);\n}\n\n\n/* =============================================================================\n   TOKENS SEMÂNTICOS — dark mode\n   ============================================================================= */\n\n[data-theme=\"dark\"],\n.dk {\n  /* --- Superfícies --- */\n  --color-bg-default:     var(--primitive-dark-900);     /* #3E4E3A — deep green page (dark: mais contraste) */\n  --color-bg-subtle:      var(--primitive-dark-900);     /* #3E4E3A — deep */\n  --color-bg-muted:       var(--primitive-dark-800);     /* #50644D — VD-7 raised (destaca sobre o deep) */\n  --color-surface:        rgba(255, 255, 255, 0.05);\n  --color-surface-raised: rgba(255, 255, 255, 0.08);\n  --color-border:         rgba(244, 240, 232, 0.12);\n  --color-border-subtle:  rgba(244, 240, 232, 0.07);\n\n  /* --- Texto --- */\n  --color-text-primary:   var(--primitive-cream-200);                   /* #F4F0E8 */\n  --color-text-secondary: rgba(244, 240, 232, 0.58);\n  --color-text-tertiary:  rgba(244, 240, 232, 0.32);\n  --color-text-disabled:  rgba(244, 240, 232, 0.24);\n  --color-text-on-brand:  var(--primitive-dark-900);\n  --color-text-on-dark:   var(--primitive-cream-200);\n\n  /* --- Marca --- */\n  --color-brand:          var(--primitive-gold-500);     /* #CBA03A — ouro quente em dark */\n  --color-brand-subtle:   rgba(203, 160, 58, 0.15);\n  --color-brand-on-dark:  var(--primitive-gold-400);     /* #E2C46B — ouro sobre superfície escura */\n  --color-accent-navy:    var(--primitive-navy-700);\n  --color-action:         var(--primitive-navy-600);   /* #34568A — navy em dark */\n  --color-action-hover:   var(--primitive-navy-500);   /* #486EA8 */\n  --color-action-subtle:  rgba(52, 86, 138, 0.16);\n\n  /* --- Semânticas --- */\n  --color-success:        var(--primitive-success-400);\n  --color-success-bg:     var(--primitive-success-bg-dark);\n  --color-warning:        var(--primitive-warning-400);\n  --color-warning-bg:     var(--primitive-warning-bg-dark);\n  --color-error:          var(--primitive-error-400);\n  --color-error-bg:       var(--primitive-error-bg-dark);\n  --color-info:           var(--primitive-info-400);\n  --color-info-bg:        var(--primitive-info-bg-dark);\n\n  /* --- Data Viz --- */\n  --dataviz-1: var(--primitive-dataviz-1-dk);\n  --dataviz-2: var(--primitive-dataviz-2-dk);\n  --dataviz-3: var(--primitive-dataviz-3-dk);\n  --dataviz-4: var(--primitive-dataviz-4-dk);\n  --dataviz-5: var(--primitive-dataviz-5-dk);\n  --dataviz-6: var(--primitive-dataviz-6-dk);\n  --dataviz-7: var(--primitive-dataviz-7-dk);\n  --dataviz-8: var(--primitive-dataviz-8-dk);\n\n  /* --- Elevação (sombras) --- */\n  --shadow-none:    none;\n  --shadow-low:     0 1px 3px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.2);\n  --shadow-mid:     0 4px 6px rgba(0, 0, 0, 0.3), 0 2px 4px rgba(0, 0, 0, 0.2);\n  --shadow-high:    0 10px 15px rgba(0, 0, 0, 0.4), 0 4px 6px rgba(0, 0, 0, 0.2);\n  --shadow-overlay: 0 20px 25px rgba(0, 0, 0, 0.5), 0 10px 10px rgba(0, 0, 0, 0.2);\n}\n\n/* Modo escuro é OPT-IN explícito: adicione `data-theme=\"dark\"` ou `.dk` ao\n   elemento raiz. Os tokens dark vivem no bloco [data-theme=\"dark\"], .dk acima\n   (é a API registrada). O produto é fixado em light. (Um fallback automático\n   via @media prefers-color-scheme foi removido para evitar duplicação de\n   valores — reative aplicando a classe no root conforme a preferência.) */\n\n\n/* =============================================================================\n   TIPOGRAFIA — tokens globais (independentes de tema)\n   ============================================================================= */\n\n:root {\n  /* Família */\n  --font-sans:    'Aptos', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;\n  --font-numeric: 'Aptos', 'Segoe UI', system-ui, -apple-system, sans-serif; /* ativar com font-variant-numeric: tabular-nums */\n\n  /* Escala — Editorial (marca, comunicação, decks) */\n  --font-size-display:    68px;\n  --font-size-h1:         52px;\n  --font-size-h2:         36px;\n  --font-size-h3:         28px;\n  --font-size-h4:         24px;\n  --font-size-body-lg:    24px;\n  --font-size-body:       20px;\n  --font-size-label:      14px;\n  --font-size-caption:    11px;\n\n  /* Escala — Produto (UI, tabelas, listas densas) */\n  --font-size-ui-2xl:     20px;\n  --font-size-ui-xl:      18px;\n  --font-size-ui-lg:      16px;\n  --font-size-ui-md:      14px;\n  --font-size-ui-sm:      13px;\n  --font-size-ui-xs:      12px;\n  --font-size-ui-2xs:     11px;\n\n  /* Pesos */\n  --font-weight-regular: 400;\n  --font-weight-medium:  500;\n  --font-weight-semibold: 600;\n  --font-weight-bold:    700;\n\n  /* Line heights */\n  --line-height-tighter: 1.0;\n  --line-height-tight:   1.2;\n  --line-height-snug:    1.35;\n  --line-height-normal:  1.5;\n  --line-height-relaxed: 1.7;\n  --line-height-loose:   1.8;\n\n  /* Letter spacing */\n  --letter-spacing-tight:   -0.01em;\n  --letter-spacing-normal:   0;\n  --letter-spacing-wide:     0.03em;\n  --letter-spacing-wider:    0.06em;\n  --letter-spacing-widest:   0.12em;\n\n  /* Regra: headings editoriais usam text-transform: uppercase + letter-spacing-wide ou wider */\n  /* Labels e captions: uppercase + widest */\n  /* Body e UI: sentence case + normal */\n}\n\n\n/* =============================================================================\n   ESPAÇAMENTO — escala 8px base\n   ============================================================================= */\n\n:root {\n  --space-0:   0;\n  --space-px:  1px;\n  --space-0-5: 2px;\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:   12px;\n  --space-4:   16px;\n  --space-5:   20px;\n  --space-6:   24px;\n  --space-7:   28px;\n  --space-8:   32px;\n  --space-10:  40px;\n  --space-12:  48px;\n  --space-14:  56px;\n  --space-16:  64px;\n  --space-20:  80px;\n  --space-24:  96px;\n  --space-28:  112px;\n  --space-32:  128px;\n  --space-40:  160px;\n\n  /* Aliases semânticos */\n  --space-section-y:    var(--space-20);   /* padding vertical de seções editoriais */\n  --space-container-x: var(--space-16);   /* margem lateral do container (mobile) */\n  --space-card:         var(--space-6);   /* padding interno de cards */\n  --space-input:        var(--space-3) var(--space-4);  /* padding de inputs */\n}\n\n\n/* =============================================================================\n   BORDAS E RAIOS\n   ============================================================================= */\n\n:root {\n  --radius-none: 0;\n  --radius-sm:   4px;   /* inputs, tags, small elements */\n  --radius-md:   8px;   /* cards, botões, dropdowns */\n  --radius-lg:   12px;  /* modais, drawers, popovers */\n  --radius-xl:   16px;  /* hero cards, banners */\n  --radius-2xl:  24px;  /* large surfaces */\n  --radius-full: 9999px; /* pills, badges, avatars */\n\n  --border-width-thin:    1px;\n  --border-width-default: 1.5px;\n  --border-width-thick:   2px;\n}\n\n\n/* =============================================================================\n   MOTION — duração e easing\n   ============================================================================= */\n\n:root {\n  /* Durações */\n  --duration-instant:  80ms; /* @kind other */\n  --duration-fast:     150ms; /* @kind other */\n  --duration-normal:   250ms; /* @kind other */\n  --duration-slow:     400ms; /* @kind other */\n  --duration-spiral:   700ms; /* @kind other */\n  --duration-page:     300ms; /* @kind other */\n\n  /* Easing */\n  --ease-default:  cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-in:       cubic-bezier(0.4, 0, 1, 1); /* @kind other */\n  --ease-out:      cubic-bezier(0, 0, 0.2, 1); /* @kind other */\n  --ease-spring:   cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n  --ease-linear:   linear; /* @kind other */\n\n  /* Propriedades de transição prontas */\n  --transition-colors:    color var(--duration-fast) var(--ease-default),\n                          background-color var(--duration-fast) var(--ease-default),\n                          border-color var(--duration-fast) var(--ease-default);\n  --transition-opacity:   opacity var(--duration-normal) var(--ease-default); /* @kind other */\n  --transition-transform: transform var(--duration-normal) var(--ease-out); /* @kind other */\n  --transition-shadow:    box-shadow var(--duration-fast) var(--ease-default); /* @kind other */\n  --transition-all:       all var(--duration-normal) var(--ease-default); /* @kind other */\n}\n\n\n/* =============================================================================\n   BREAKPOINTS — referência (use via @media, não via variável CSS)\n   ============================================================================= */\n\n/*\n  xs:   0–479px      (mobile pequeno)\n  sm:   480–767px    (mobile)\n  md:   768–1023px   (tablet)\n  lg:   1024–1279px  (desktop pequeno)\n  xl:   1280–1535px  (desktop)\n  2xl:  1536px+      (desktop grande)\n\n  Grid do produto web:\n  - Colunas: 12\n  - Gutter:  24px\n  - Margem lateral: 24px (mobile) / 32px (tablet) / 64px (desktop+)\n  - Max width container: 1440px\n*/\n\n\n/* =============================================================================\n   Z-INDEX — camadas\n   ============================================================================= */\n\n:root {\n  --z-behind:    -1; /* @kind other */\n  --z-base:       0; /* @kind other */\n  --z-raised:    10; /* @kind other */\n  --z-dropdown:  100; /* @kind other */\n  --z-sticky:    200; /* @kind other */\n  --z-overlay:   300; /* @kind other */\n  --z-modal:     400; /* @kind other */\n  --z-toast:     500; /* @kind other */\n  --z-tooltip:   600; /* @kind other */\n}\n\n/* ============================================================\n   AUREA — Typography · @font-face + semantic type roles\n   Built ON TOP of tokens.css (the source of truth for raw values).\n   Registers the Aptos brand face and ready-to-use role classes.\n   ============================================================ */\n\n/* Aptos is THE Aurea typeface (Microsoft 365 system face). Where Office/Aptos\n   is installed the real font renders via local(); everywhere else a bundled\n   metric-compatible proxy stands in under the same name, so layout, decks and\n   PPTX export stay identical and are tagged \"Aptos\". */\n@font-face {\n  font-family: \"Aptos\";\n  src: local(\"Aptos\"), local(\"Aptos Display\"), local(\"Aptos-Regular\"),\n       url(\"5842f606-37ce-43dd-9736-3c5b442d22c3\") format(\"truetype-variations\");\n  font-weight: 100 900;\n  font-style: normal;\n  font-display: swap;\n}\n\n/* ============================================================\n   EDITORIAL ROLES — marca, comunicação, decks.\n   RULE: headings are UPPERCASE + tracked. Body is sentence case.\n   ============================================================ */\n.h-display{font-family:var(--font-sans);font-weight:var(--font-weight-bold);font-size:var(--font-size-display);line-height:var(--line-height-tighter);text-transform:uppercase;letter-spacing:var(--letter-spacing-wide);color:var(--color-text-primary)}\n.h1{font-family:var(--font-sans);font-weight:var(--font-weight-bold);font-size:var(--font-size-h1);line-height:var(--line-height-tight);text-transform:uppercase;letter-spacing:var(--letter-spacing-wide);color:var(--color-text-primary)}\n.h2{font-family:var(--f olor:var(--color-text-secondary)}\n\n/* ============================================================\n   LABELS, CAPTIONS, NUMERICS\n   ============================================================ */\n.eyebrow,.label{font-family:var(--font-sans);font-weight:var(--font-weight-semibold);font-size:var(--font-size-label);text-transform:uppercase;letter-spacing:var(--letter-spacing-widest);color:var(--color-brand)}\n.caption{font-family:var(--font-sans);font-weight:var(--font-weight-medium);font-size:var(--font-size-caption);text-transform:uppercase;letter-spacing:var(--letter-spacing-widest);color:var(--color-text-tertiary)}\n/* Numbers, currency, %, durations — ALWAYS tabular */\n.numeric{font-family:var(--font-numeric);font-weight:var(--font-weight-semibold);font-variant-numeric:tabular-nums;letter-spacing:var(--letter-spacing-tight);color:var(--color-text-primary)}\n.numeric--pos{color:var(--color-success)}\n.numeric--neg{color:var(--color-error)}\n\n/* ============================================================\n   SURFACE PATTERN — dark containers on light (verde-dólar VD-7)\n   Large dark fields (full-bleed, sections, sidebar) use .surface-inverse\n   = VD-7 #50644D. Small dark containers nested ON a green panel — chips,\n   icon tiles, badges — use .surface-inverse-container (#5E735A).\n   ============================================================ */\n.surface-inverse{background-color:var(--color-inverse-surface);color:var(--color-text-on-dark)}\n.surface-inverse-container{background-color:var(--color-inverse-container);color:var(--color-text-on-dark)}\n\n/* Convenience base — opt-in page reset */\n.aurea-base{background:var(--color-bg-default);color:var(--color-text-primary);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}\n\n<\u002Fstyle>\n<script src=\"db793513-2443-4a7d-a10a-f681f822801f\"><\u002Fscript>\n<style>\n  body { margin: 0; background: var(--color-bg-default); }\n  a { color: var(--color-action); text-decoration: none; }\n  a:hove font-weight: 600; padding: 10px 18px; border-radius: var(--radius-full); box-shadow: var(--shadow-mid); z-index: 50;\">Copiado<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:580,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = { toast: false };\n\n  copy(text) {\n    const done = () => {\n      clearTimeout(this._t);\n      this.setState({ toast: true });\n      this._t = setTimeout(() => this.setState({ toast: false }), 1600);\n    };\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(text).then(done, () => this.fallback(text, done));\n    } else {\n      this.fallback(text, done);\n    }\n  }\n\n  fallback(text, done) {\n    const ta = document.createElement('textarea');\n    ta.value = text;\n    ta.style.position = 'fixed';\n    ta.style.opacity = '0';\n    document.body.appendChild(ta);\n    ta.select();\n    try { document.execCommand('copy'); } catch (e) {}\n    document.body.removeChild(ta);\n    done();\n  }\n\n  componentWillUnmount() { clearTimeout(this._t); }\n\n  block(cnpj, razao, endereco) {\n    return 'CNPJ: ' + cnpj + '\\nRazão social: ' + razao + '\\nEndereço: ' + endereco;\n  }\n\n  renderVals() {\n    const saus = 'ST SAUS Quadra 04, Bloco A, Sala 1338 — CEP: 70.070-938';\n    return {\n      toast: this.state.toast,\n      copyTech: () => this.copy(this.block('65.498.478/0001-39', 'DREAMERS TECH', saus)),\n      copyDreamers: () => this.copy(this.block('65.083.093/0001-00', 'DREAMERS LTDA', saus)),\n      copyAurea: () => this.copy(this.block('67.557.217/0001-78', 'AUREA ASSET MANAGEMENT LTDA', 'ST SRTVN Conjunto C, Bloco B, Sala 117 — CEP: 70.719-903')),\n      copyBra: () => this.copy('EIN: 41-3131355\\nRazão social: DREAMERS BRA LLC\\nEndereço: C/O Amar Global, 135 Madison Ave, 5FL — New York, NY 10016'),\n      copyJazz: () => this.copy('Registro nº: 402759\
